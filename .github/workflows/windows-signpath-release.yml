name: Windows SignPath release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed installer as the stable GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-signpath-release
  cancel-in-progress: false

jobs:
  sign-and-release-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dopplerhq/cli-action@v4

      - name: Validate release source and SignPath configuration
        id: release
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          SIGNPATH_APP_CONFIGURATION: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_CONFIGURATION: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            Write-Error 'SignPath production releases can only be built from main.'
            exit 1
          }

          $required = @(
            'DOPPLER_TOKEN'
            'SIGNPATH_API_TOKEN'
            'SIGNPATH_APP_CONFIGURATION'
            'SIGNPATH_INSTALLER_CONFIGURATION'
            'SIGNPATH_ORGANIZATION_ID'
            'SIGNPATH_PROJECT_SLUG'
            'SIGNPATH_SIGNING_POLICY_SLUG'
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Error "Missing required SignPath release configuration: $name"
              exit 1
            }
          }

          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            Write-Error "package.json contains an invalid release version: $version"
            exit 1
          }

          $tag = "v$version"
          if ($env:PUBLISH_RELEASE -eq 'true') {
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($existingTag) {
              Write-Error "Tag $tag already exists. Bump package.json before publishing."
              exit 1
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "TROCODE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check

      - name: Package unsigned Windows application
        shell: pwsh
        run: |
          doppler run `
            --project tro-app `
            --config prd `
            -- npm exec -- electron-forge package --platform=win32 --arch=x64

      - name: Constrain application metadata before signing
        shell: pwsh
        run: |
          $application = 'out\Tro-win32-x64\Tro.exe'
          if (-not (Test-Path $application -PathType Leaf)) {
            Write-Error "Packaged application not found: $application"
            exit 1
          }
          npm run windows:release-metadata -- `
            --file $application `
            --kind app `
            --version $env:TROCODE_RELEASE_VERSION

      - name: Upload unsigned application for origin verification
        id: upload-unsigned-application
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/Tro-win32-x64
          if-no-files-found: error
          retention-days: 1

      - name: Sign the Tro application through SignPath
        id: sign-application
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-application.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}\out\signpath\signed-app
          parameters: |
            version: ${{ toJSON(steps.release.outputs.version) }}

      - name: Verify and install the signed application
        shell: pwsh
        run: |
          $signedApplication = 'out\signpath\signed-app\Tro.exe'
          $packageApplication = 'out\Tro-win32-x64\Tro.exe'
          if (-not (Test-Path $signedApplication -PathType Leaf)) {
            Write-Error "Signed application not found: $signedApplication"
            exit 1
          }

          $signature = Get-AuthenticodeSignature $signedApplication
          if ($signature.Status -ne 'Valid') {
            Write-Error "Tro.exe signature is not valid: $($signature.Status)"
            exit 1
          }
          Copy-Item $signedApplication $packageApplication -Force

          "### SignPath application request" >> $env:GITHUB_STEP_SUMMARY
          "- Request: ${{ steps.sign-application.outputs.signing-request-web-url }}" >> $env:GITHUB_STEP_SUMMARY
          "- Publisher: $($signature.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY

      - name: Build Squirrel installer from the signed application
        shell: pwsh
        run: |
          doppler run `
            --project tro-app `
            --config prd `
            -- npm exec -- electron-forge make --arch=x64 --skip-package

      - name: Constrain installer metadata before signing
        shell: pwsh
        run: |
          $artifactDirectory = 'out\make\squirrel.windows\x64'
          $installer = Get-ChildItem $artifactDirectory -Filter '*Setup.exe' -File |
            Select-Object -First 1
          if (-not $installer) {
            Write-Error "Squirrel installer not found in $artifactDirectory"
            exit 1
          }
          npm run windows:release-metadata -- `
            --file $installer.FullName `
            --kind installer `
            --version $env:TROCODE_RELEASE_VERSION

      - name: Upload unsigned installer for origin verification
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/make/squirrel.windows/x64/*Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the Tro installer through SignPath
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}\out\signpath\signed-installer
          parameters: |
            version: ${{ toJSON(steps.release.outputs.version) }}

      - name: Verify signed release artifacts and write checksums
        shell: pwsh
        run: |
          $artifactDirectory = 'out\make\squirrel.windows\x64'
          $signedInstaller = Get-ChildItem 'out\signpath\signed-installer' -Filter '*Setup.exe' -File |
            Select-Object -First 1
          $targetInstaller = Get-ChildItem $artifactDirectory -Filter '*Setup.exe' -File |
            Select-Object -First 1
          if (-not $signedInstaller -or -not $targetInstaller) {
            Write-Error 'The signed or generated Squirrel installer is missing.'
            exit 1
          }
          if ($signedInstaller.Name -ne $targetInstaller.Name) {
            Write-Error 'SignPath returned an unexpected installer filename.'
            exit 1
          }
          Copy-Item $signedInstaller.FullName $targetInstaller.FullName -Force

          $installerSignature = Get-AuthenticodeSignature $targetInstaller.FullName
          if ($installerSignature.Status -ne 'Valid') {
            Write-Error "Installer signature is not valid: $($installerSignature.Status)"
            exit 1
          }

          $package = Get-ChildItem $artifactDirectory -Filter '*-full.nupkg' -File |
            Select-Object -First 1
          $releases = Join-Path $artifactDirectory 'RELEASES'
          if (-not $package -or -not (Test-Path $releases -PathType Leaf)) {
            Write-Error 'The full update package or RELEASES manifest is missing.'
            exit 1
          }

          $expandedPackage = Join-Path $env:RUNNER_TEMP "trocode-nupkg-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $expandedPackage | Out-Null
          tar -xf $package.FullName -C $expandedPackage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packagedApplication = Get-ChildItem $expandedPackage -Recurse -Filter 'Tro.exe' -File |
            Select-Object -First 1
          if (-not $packagedApplication) {
            Write-Error 'Tro.exe is missing from the full update package.'
            exit 1
          }
          $applicationSignature = Get-AuthenticodeSignature $packagedApplication.FullName
          if ($applicationSignature.Status -ne 'Valid') {
            Write-Error "Packaged application signature is not valid: $($applicationSignature.Status)"
            exit 1
          }

          $checksumPath = Join-Path $artifactDirectory 'SHA256SUMS.txt'
          $checksumLines = Get-ChildItem $artifactDirectory -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content -Path $checksumPath -Value $checksumLines -Encoding ascii

          "### SignPath installer request" >> $env:GITHUB_STEP_SUMMARY
          "- Request: ${{ steps.sign-installer.outputs.signing-request-web-url }}" >> $env:GITHUB_STEP_SUMMARY
          "- Installer: $($targetInstaller.Name)" >> $env:GITHUB_STEP_SUMMARY
          "- Publisher: $($installerSignature.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish stable GitHub Release for app and web updates
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifactDirectory = 'out\make\squirrel.windows\x64'
          $assets = @(
            (Get-ChildItem $artifactDirectory -Filter '*Setup.exe' -File | Select-Object -First 1).FullName
            (Get-ChildItem $artifactDirectory -Filter '*-full.nupkg' -File | Select-Object -First 1).FullName
            (Join-Path $artifactDirectory 'RELEASES')
            (Join-Path $artifactDirectory 'SHA256SUMS.txt')
          )
          gh release create '${{ steps.release.outputs.tag }}' @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Tro $env:TROCODE_RELEASE_VERSION" `
            --notes "Signed by SignPath.io; certificate by SignPath Foundation. Code signing policy: https://github.com/$env:GITHUB_REPOSITORY/blob/main/CODE_SIGNING_POLICY.md" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload signed Windows installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Tro-Windows-x64-SignPath-${{ github.run_number }}
          path: out/make/squirrel.windows/x64/*
          if-no-files-found: error
          retention-days: 30
