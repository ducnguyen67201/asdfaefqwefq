[package]
name = "trocode-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
publish = false

[lib]
name = "trocode_api"
path = "src/lib.rs"

[[bin]]
name = "trocode-api"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
async-trait = "0.1.89"
async-stream = "0.3.6"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = { version = "0.8.6", features = ["http1", "json", "macros", "multipart", "tokio"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
editpe = { version = "0.2.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
futures-util = "0.3.31"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
jsonschema = { version = "=0.50.0", default-features = false }
pdf-extract = "0.12.0"
rand = "0.9.2"
regex = "1.11.2"
regress = "0.11.1"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
reqwest-mcp = { package = "reqwest", version = "=0.13.2", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.0.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json", "migrate", "time", "uuid"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["json", "migrate", "time", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.16"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = "0.7.16"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
typify = "0.7.0"
unicode-normalization = "0.1.24"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1.8.0"
tempfile = "3.23.0"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
